<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; font-src https://cdnjs.cloudflare.com;">
  <title>Pet Hospital Management</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="js/pages/orders.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* ── Toast notifications ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #2d6a4f;
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .22);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .3s, transform .3s;
      z-index: 9999;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    #toast.error {
      background: #c0392b;
    }

    /* ── Confirm dialog ── */
    #confirm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 8888;
      align-items: center;
      justify-content: center;
    }

    #confirm-overlay.show {
      display: flex;
    }

    #confirm-box {
      background: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
    }

    #confirm-box h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    #confirm-box p {
      margin: 0 0 22px;
      color: #555;
      font-size: 14px;
    }

    #confirm-box .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    #confirm-box .btn-cancel {
      background: #eee;
      color: #333;
      border: none;
      padding: 9px 22px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
    }

    #confirm-box .btn-confirm {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 9px 22px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
    }

    /* ── Loading ── */
    #app-loading {
      position: fixed;
      inset: 0;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      z-index: 9998;
    }

    #app-loading .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #ddd;
      border-top-color: #2d6a4f;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #app-loading p {
      color: #666;
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>

<body>
  <div id="app-loading">
    <div class="spinner"></div>
    <p>Loading Pet Hospital…</p>
  </div>

  <div class="container" id="app" style="display:none">
    <!-- Sidebar injected here -->
    <div id="sidebar-container"></div>
    <!-- Page content rendered here -->
    <div class="main-content" id="page-content"></div>
  </div>

  <div id="toast"></div>

  <div id="confirm-overlay">
    <div id="confirm-box">
      <h3>Confirm Delete</h3>
      <p id="confirm-msg">Are you sure you want to delete this record? This cannot be undone.</p>
      <div class="btn-row">
        <button class="btn-cancel" id="confirm-cancel">Cancel</button>
        <button class="btn-confirm" id="confirm-ok">Delete</button>
      </div>
    </div>
  </div>

  ////////////////////////////////////////////////////////
<script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/hospitals.js"></script>
  <script src="js/pages/products.js"></script>
  <script src="js/pages/employees.js"></script>
  <script src="js/pages/clients.js"></script>
  <script src="js/pages/bank.js"></script>
  <script src="js/pages/categories.js"></script>
  <script src="js/pages/items.js"></script>
  <script src="js/pages/recievers.js"></script>
  <script src="js/pages/stock.js"></script>
  <script src="js/pages/charts.js"></script>
  <script src="js/pages/suppliers.js"></script>
  <script src="js/pages/invoice-builder.js"></script>
  <script src="js/pages/orders.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
